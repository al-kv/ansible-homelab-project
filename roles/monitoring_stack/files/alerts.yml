groups:
  - name: node_alerts
    interval: 30s
    rules:
      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU > 80% на {{ $labels.instance }}"
          description: "CPU держится выше 80% более 5 минут."
