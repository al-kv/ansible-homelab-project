---
- name: Create monitoring directory
  ansible.builtin.file:
    path: /opt/monitoring
    state: directory
    mode: '0755'

- name: Copy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/monitoring/docker-compose.yml
    mode: '0644'
  notify: Restart monitoring

- name: Copy prometheus.yml (template — targets из inventory)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus.yml
    mode: '0644'
  notify: Restart monitoring

- name: Copy alerts.yml
  ansible.builtin.copy:
    src: alerts.yml
    dest: /opt/monitoring/alerts.yml
    mode: '0644'
  notify: Restart monitoring

- name: Copy alertmanager.yml
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /opt/monitoring/alertmanager.yml
    mode: '0644'
  notify: Restart monitoring

- name: Copy loki-config.yml
  ansible.builtin.copy:
    src: loki-config.yml
    dest: /opt/monitoring/loki-config.yml
    mode: '0644'
  notify: Restart monitoring

- name: Copy promtail-config.yml (для контейнера)
  ansible.builtin.copy:
    src: promtail-config.yml
    dest: /opt/monitoring/promtail-config.yml
    mode: '0644'
  notify: Restart monitoring

- name: Copy Grafana provisioning
  ansible.builtin.copy:
    src: grafana-provisioning/
    dest: /opt/monitoring/grafana-provisioning/
    mode: '0644'
  notify: Restart monitoring

- name: Start monitoring stack
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring
    state: present

# --- ПРОВЕРКИ ---
- name: Wait for Prometheus
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/ready
    status_code: 200
  register: monitoring_stack_prom
  retries: 30
  delay: 3
  until: monitoring_stack_prom.status == 200

- name: Wait for Grafana
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/api/health
    status_code: 200
  register: monitoring_stack_graf
  retries: 30
  delay: 3
  until: monitoring_stack_graf.status == 200

- name: Wait for Loki
  ansible.builtin.uri:
    url: http://127.0.0.1:3100/ready
    status_code: 200
  register: monitoring_stack_lok
  retries: 30
  delay: 3
  until: monitoring_stack_lok.status == 200

- name: Wait for Alertmanager
  ansible.builtin.uri:
    url: http://127.0.0.1:9093/-/ready
    status_code: 200
  register: monitoring_stack_am
  retries: 30
  delay: 3
  until: monitoring_stack_am.status == 200
