# =============================================================================
# ФАЙЛ: roles/node_exporter/tasks/main.yml
# =============================================================================
# НАЗНАЧЕНИЕ: роль, которая ставит node_exporter на любую машину.
# node_exporter — программа, которая собирает метрики (CPU, RAM, диск, сеть)
# и отдаёт их по HTTP на порт 9100. Prometheus потом их забирает.
#
# РОЛЬ РАБОТАЕТ НА: Ubuntu/Debian и Rocky/Alma (кросс-дистрибутивная).
# ЗАПУСКАЕТСЯ ОТ: root (become: true в site.yml).
# =============================================================================
---
# "---" — маркер начала YAML-документа. Просто соглашение.


# -----------------------------------------------------------------------------
# ЗАДАЧА 1. Создать системного пользователя node_exporter
# -----------------------------------------------------------------------------
# ЗАЧЕМ: не запускать node_exporter от root. Если программу взломают —
#        урон будет ограничен правами этого пользователя, а не всей системы.
- name: Create node_exporter user
  # ansible.builtin.user — модуль для управления пользователями Linux.
  # Префикс ansible.builtin. означает: "это встроенный модуль Ansible".
  # Раньше писали просто user:, сейчас — полное имя (best practice).
  ansible.builtin.user:
    # Имя пользователя. Обычно совпадает с названием программы.
    name: node_exporter
    # shell: /usr/sbin/nologin — запретить интерактивный вход.
    # Даже если кто-то узнает пароль — зайти по SSH не сможет.
    shell: /usr/sbin/nologin
    # system: true — создать системного пользователя (UID < 1000).
    # Такие пользователи не показываются в списке логинов и предназначены
    # для сервисов, а не для людей.
    system: true
    # create_home: false — НЕ создавать домашнюю папку /home/node_exporter.
    # Программе она не нужна. Меньше мусора — меньше поверхности атаки.
    create_home: false


# -----------------------------------------------------------------------------
# ЗАДАЧА 2. Скачать архив node_exporter с GitHub
# -----------------------------------------------------------------------------
# ЗАЧЕМ: node_exporter нет в стандартных репозиториях Ubuntu/Rocky.
#        Берём официальный релиз с GitHub.
- name: Download node_exporter
  # ansible.builtin.get_url — модуль для скачивания файлов по HTTP/HTTPS/FTP.
  ansible.builtin.get_url:
    # URL собирается из переменной {{ node_exporter_version }}.
    # Она лежит в group_vars/all/vars.yml → "1.8.2".
    # Меняешь версию в одном месте — меняется везде.
    # Итоговый URL: https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    # Куда скачать на ЦЕЛЕВОЙ машине.
    # /tmp/ — временная папка, всё равно потом удалим.
    dest: /tmp/node_exporter.tar.gz
    # Права на скачанный файл. 0644 = rw-r--r-- (владелец читает/пишет, остальные читают).
    mode: '0644'


# -----------------------------------------------------------------------------
# ЗАДАЧА 3. Распаковать архив
# -----------------------------------------------------------------------------
# ЗАЧЕМ: get_url скачал .tar.gz. Чтобы достать из него бинарник — распаковать.
- name: Extract archive
  # ansible.builtin.unarchive — модуль для распаковки архивов (.tar, .tar.gz, .zip).
  ansible.builtin.unarchive:
    # Что распаковать.
    src: /tmp/node_exporter.tar.gz
    # Куда распаковать. В /tmp/ — потом перенесём бинарник куда надо.
    dest: /tmp/
    # remote_src: true — архив УЖЕ на целевой машине (мы его скачали задачей 2).
    # Если поставить false — Ansible сначала скопирует архив с контрольной машины.
    # Нам это не нужно, архив и так на месте.
    remote_src: true


# -----------------------------------------------------------------------------
# ЗАДАЧА 4. Установить бинарник в /usr/local/bin
# -----------------------------------------------------------------------------
# ЗАЧЕМ: положить исполняемый файл в стандартное место для программ,
#        установленных руками (не через пакетный менеджер).
- name: Install binary
  # ansible.builtin.copy — модуль копирования файлов.
  # Умеет: копировать с контрольной машины (src: file), копировать на целевой (remote_src: true),
  #        создавать файл с содержимым (content:).
  ansible.builtin.copy:
    # Откуда взять файл. Из распакованной папки.
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    # Куда положить. /usr/local/bin — стандарт для бинарников,
    # установленных вручную. Он есть в $PATH, значит команду можно вызывать по имени.
    dest: /usr/local/bin/node_exporter
    # Владелец файла — созданный пользователь node_exporter.
    owner: node_exporter
    # Группа — та же.
    group: node_exporter
    # 0755 = rwxr-xr-x. Владелец может читать/писать/исполнять,
    # остальные — читать/исполнять. Это стандарт для бинарников.
    mode: '0755'
    # Файл-источник лежит на ЦЕЛЕВОЙ машине (в /tmp/), не у нас локально.
    remote_src: true
  # notify — триггер для хендлера. Если эта задача ИЗМЕНИЛА файл (обновила
  # версию бинарника) — в конце плея запустится handler "restart node_exporter".
  # Если файл не менялся — handler НЕ запустится (экономия).
  notify: restart node_exporter


# -----------------------------------------------------------------------------
# ЗАДАЧА 5. Создать systemd-юнит для node_exporter
# -----------------------------------------------------------------------------
# ЗАЧЕМ: чтобы сервис управлялся через systemctl — стартовал сам при загрузке,
#        перезапускался при падении, останавливался командой.
# Без systemd-юнита пришлось бы запускать бинарник вручную каждый раз.
- name: Install systemd unit
  ansible.builtin.copy:
    # Куда положить файл юнита.
    # /etc/systemd/system/ — стандартная папка для юнитов, созданных вручную.
    dest: /etc/systemd/system/node_exporter.service
    # content: | — создать файл С УКАЗАННЫМ содержимым (а не копировать откуда-то).
    # Символ | означает "многострочная строка в YAML" — сохранит переносы строк.
    content: |
      [Unit]
      Description=Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      ExecStart=/usr/local/bin/node_exporter
      Restart=always

      [Install]
      WantedBy=multi-user.target
    # Права на файл юнита: rw-r--r--.
    mode: '0644'
  # Если содержимое юнита изменилось — перезапустить сервис в конце.
  notify: restart node_exporter


# -----------------------------------------------------------------------------
# ЗАЧАДА 6. Включить и запустить сервис
# -----------------------------------------------------------------------------
# ЗАЧЕМ: systemd знает о юните, но сервис не запущен.
#        Эта задача его запускает и включает автозапуск.
- name: Enable and start
  # ansible.builtin.service — модуль управления сервисами.
  # Работает и с systemd, и с sysvinit, и с upstart — сам определит.
  ansible.builtin.service:
    # Имя сервиса = имя файла юнита без расширения (.service).
    name: node_exporter
    # state: started — запустить СЕЙЧАС.
    # Если уже запущен — ничего не делает (идемпотентность).
    state: started
    # enabled: true — включить АВТОЗАПУСК при загрузке системы.
    # Без этого после перезагрузки сервис не поднимется сам.
    enabled: true


# -----------------------------------------------------------------------------
# ЗАДАЧА 7. Открыть порт 9100 для Ubuntu/Debian (ufw)
# -----------------------------------------------------------------------------
# ЗАЧЕМ: Prometheus на vm-ctrl должен иметь доступ к /metrics по порту 9100.
#        Без открытия порта файрвол заблокирует запрос.
#
# ПОЧЕМУ ОТДЕЛЬНО ДЛЯ DEBIAN И REDHAT: разные файрволы.
# Ubuntu/Debian — ufw. Rocky/Alma — firewalld. Разные модули.
- name: Allow port 9100 (Debian)
  # community.general.ufw — модуль для управления ufw.
  # community.general — коллекция, ставится через ansible-galaxy.
  community.general.ufw:
    # rule: allow — разрешить.
    rule: allow
    # port — какой порт. В кавычках, потому что YAML может спутать с числом.
    port: '9100'
    # proto: tcp — протокол. Метрики отдаются по HTTP, это TCP.
    proto: tcp
  # when — выполнить ТОЛЬКО если система — семейства Debian.
  # Ansible сам определяет ansible_os_family (это факт о машине).
  when: ansible_os_family == "Debian"


# -----------------------------------------------------------------------------
# ЗАДАЧА 8. Открыть порт 9100 для Rocky/Alma (firewalld)
# -----------------------------------------------------------------------------
# То же самое, но другим модулем — для RedHat-семейства.
- name: Allow port 9100 (RedHat)
  # ansible.posix.firewalld — модуль для управления firewalld.
  # ansible.posix — коллекция для POSIX-систем.
  ansible.posix.firewalld:
    # Порт с протоколом в одном параметре.
    port: 9100/tcp
    # permanent: true — сохранить правило навсегда (после перезагрузки тоже).
    permanent: true
    # state: enabled — правило активно.
    state: enabled
    # immediate: true — применить СЕЙЧАС, не дожидаясь перезагрузки firewalld.
    # Без этого правило заработает только после reload.
    immediate: true
  # Только для RedHat-семейства.
  when: ansible_os_family == "RedHat"
