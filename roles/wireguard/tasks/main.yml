---
# 1. Установка wireguard. Только для Debian — в задании vm-vpn на Debian.
#    На RedHat пакет называется иначе, но у нас там wireguard не нужен.
- name: Install wireguard (Debian)
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

# 2. Включить IP forwarding. Без этого VPN-клиенты не выйдут в интернет
#    через сервер — ядро не будет перенаправлять пакеты между интерфейсами.
#    sysctl_set: true — записать значение в ядро.
#    reload: true — перечитать sysctl без перезагрузки.
- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    reload: true

# 3. Создать конфиг wg0 из шаблона. Внутри — приватный ключ из Vault.
#    mode 0600 — только root читает (там приватный ключ, критично).
#    notify — если конфиг изменился, перезапустить wireguard.
- name: Create wg0 config
  ansible.builtin.template:
    src: wg0.conf.j2                 # ищется в roles/wireguard/templates/
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify: restart wireguard

# 4. Включить сервис wg-quick@wg0.
#    wg-quick@wg0 — systemd-юнит, который поднимает интерфейс по конфигу wg0.conf.
#    state: started — запустить сейчас. enabled: true — автозапуск при загрузке.
- name: Enable wg-quick@wg0
  ansible.builtin.service:
    name: wg-quick@wg0
    state: started
    enabled: true

# 5. Открыть порт 51820/udp в ufw. Именно UDP — WireGuard работает по UDP.
#    Только для Debian (vm-vpn на Debian).
- name: Firewall port 51820/udp (Debian)
  community.general.ufw:
    rule: allow
    port: '51820'
    proto: udp
  when: ansible_os_family == "Debian"
