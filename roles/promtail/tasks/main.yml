---
# 1. Скачать promtail с GitHub. Версия — из переменной promtail_version.
- name: Download promtail
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
    dest: /tmp/promtail.zip          # куда скачать на целевой машине
    mode: '0644'

# 2. Распаковать zip. remote_src: true — архив уже на целевой, не копировать.
- name: Unzip
  ansible.builtin.unarchive:
    src: /tmp/promtail.zip
    dest: /tmp/
    remote_src: true

# 3. Положить бинарник в /usr/local/bin — стандартное место для ручных установок.
#    mode 0755 — исполняемый. notify — если файл изменился, перезапусти сервис.
- name: Install binary
  ansible.builtin.copy:
    src: /tmp/promtail-linux-amd64
    dest: /usr/local/bin/promtail
    mode: '0755'
    remote_src: true
  notify: Restart promtail

# 4. Создать конфиг из шаблона (Jinja2). В шаблоне подставятся переменные
#    типа {{ loki_url }} и {{ inventory_hostname }}. Это отличается от copy:
#    template рендерит переменные, copy — просто копирует.
- name: Create config
  ansible.builtin.template:
    src: promtail-config.yml.j2       # ищется в roles/promtail/templates/
    dest: /etc/promtail-config.yml
    mode: '0644'
  notify: Restart promtail

# 5. Создать systemd-юнит. content: | — многострочный текст прямо в задаче.
#    ExecStart — команда запуска. Restart=always — перезапускать при падении.
- name: Install systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/promtail.service
    content: |
      [Unit]
      Description=Promtail
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/promtail -config.file=/etc/promtail-config.yml
      Restart=always

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify: Restart promtail

# 6. Запустить сервис сейчас (state) и включить автозапуск при загрузке (enabled).
- name: Enable promtail
  ansible.builtin.service:
    name: promtail
    state: started
    enabled: true
